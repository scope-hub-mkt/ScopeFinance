name: CI

# Gate de CI do ScopeFinance — criado em 25/08/2026.
#
# ⚠️ Até esta data o projeto não tinha NENHUMA verificação automática, e o
# Gate G0 da Scope Dashboard registrou isso como risco ACEITO (`D-18`):
# *"migrar dado financeiro de um sistema sem teste significa que nenhuma
# regressão de lá é detectável antes de chegar aqui"*.
#
# ⚠️ **E o `lint` era pior que ausente: era falso.** O script chamava
# `next lint` sem ESLint instalado e sem config — comando que promete análise
# e entrega silêncio. O `next build` fazia o mesmo (pula a etapa quando não
# acha ESLint), e por isso o `Initial commit` deployou na Vercel com um erro
# de aspas não escapadas no código. Um verde que não verifica nada é pior do
# que vermelho, porque é lido como garantia.
#
# Por isso o `lint` é um passo PRÓPRIO aqui, e o ESLint é dependência real do
# `package.json` — não algo que o build possa decidir pular em silêncio.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest

    # Postgres de verdade para `tests/integracao/**` — portado da Scope
    # Dashboard em 26/08/2026.
    #
    # ⚠️ **O risco que isto fecha estava escrito no README deste projeto:**
    # *"os testes usam um Supabase em memória: provam a regra de negócio, NÃO
    # o SQL. Constraint de banco só é exercitada rodando o schema."* Com o
    # serviço abaixo, as três constraints que sustentam a integração passam a
    # ser verificadas: o índice funcional do documento (Ponto 1 do Gate G0), a
    # idempotência da recorrência e a da `referencia_externa`.
    #
    # O schema inteiro é aplicado do zero a cada execução: isso prova de graça
    # que `supabase/schema.sql` continua aplicável em banco vazio.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Ordem escolhida: o mais barato e mais específico primeiro. Um erro de
      # tipo apontado por `tsc` é mais fácil de ler do que o mesmo erro
      # embrulhado no build do Next.
      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Trava do sistema de design — portada da Scope Dashboard em 26/08/2026
      # (Onda 0 de `docs/AGENTE-IDENTIDADE-VISUAL.md` §B.4, lá). Ela vem ANTES
      # da refatoração visual de propósito: regra que ninguém verifica é
      # sugestão, e a 13ª divergência nasceria durante a própria refatoração.
      #
      # Hex literal, `rgb()`, `hsl()`, paleta de framework, `shadow-*` e emoji
      # decorativo em `app/` e `components/` quebram o build. O tema mora em
      # `app/globals.css`, e é o único lugar onde cor é escrita à mão.
      - name: Design
        run: npm run lint:design

      - name: Aplicar o schema no Postgres do CI
        run: psql "postgresql://postgres:ci@localhost:5432/postgres" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql

      # Com `DATABASE_URL` presente, `tests/integracao/schema-constraints`
      # liga sozinho — desenhado assim de propósito: teste que exige memória
      # humana para ser ligado é teste que não roda.
      - name: Testes (unidade + integração contra Postgres real)
        run: npm run test
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres

      # As variáveis do Supabase são placeholders: `createSupabaseAdmin()` só
      # as lê em tempo de execução, e nenhuma rota é pré-renderizada — por
      # isso o build passa sem projeto real.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
